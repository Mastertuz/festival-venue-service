{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Festival Venue Service{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="container d-flex align-items-center gap-3 border-bottom mb-4">
        <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="Festival Venue Service"
            class="fvs-logo"
        >

        {% include "includes/navigation.html" %}
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container site-footer mt-4 py-3">
        <p class="mb-0">
            © <span id="current-year"></span> Festival Venue Service
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
