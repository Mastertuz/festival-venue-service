<article class="card venue-card mb-3">
    {% if venue.image %}
        <img src="{{ venue.image.url }}" alt="{{ venue.name }}" class="card-img-top venue-card-photo">
    {% endif %}
    <div class="card-body">
        <h2 class="card-title h4">
            {{ venue.name|default:"Без названия" }}
        </h2>

        <p class="card-text">
            Вместимость: {{ venue.capacity }} мест
        </p>

        <a
            href="{{ venue.get_absolute_url }}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
